<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c2b45">
<title>Atlas Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1c2b45;      /* Atlas panel */
    --night-2:#24365a;
    --signal:#3d6bff;     /* Atlas outgoing */
    --signal-ink:#ffffff;
    --paper:#eef1f5;      /* thread backdrop */
    --card:#ffffff;
    --ink:#1a2233;
    --mute:#66708a;
    --line:#dde2ea;
    --live:#46d39a;
    --warn:#c2412d; --warn-bg:#fdeae6;
    --r-lg:22px; --r-md:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:15px/1.45 "Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;display:flex;height:100vh;height:100dvh;overflow:hidden}
  button,input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* ---------- side panel ---------- */
  .side{width:360px;flex:none;background:var(--night);color:#e7ecf6;display:flex;flex-direction:column;min-height:0}
  .brand{padding:22px 20px 16px}
  .mark{display:flex;align-items:baseline;gap:10px}
  .mark h1{font-size:34px;line-height:1;font-weight:900;letter-spacing:-.035em}
  .mark h1 span{font-weight:500;color:#9fb0d4}
  .line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:#aebbd8}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(70,211,154,.18)}
  .dot.off{background:#e0a24a;box-shadow:0 0 0 3px rgba(224,162,74,.18)}
  .tools{display:flex;gap:8px;padding:0 16px 14px}
  .find{flex:1;position:relative}
  .find input{width:100%;background:var(--night-2);border:1px solid #33496f;border-radius:12px;padding:10px 12px 10px 36px;color:#fff;font-size:15px}
  .find input::placeholder{color:#8797ba}
  .find svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#8797ba;fill:none;stroke-width:2;stroke-linecap:round}
  .compose-new{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;background:var(--signal);color:#fff;font-weight:700;padding:0 14px;cursor:pointer}
  .compose-new svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
  .convs{flex:1;overflow-y:auto;padding:0 8px 16px;scrollbar-width:thin;scrollbar-color:#33496f transparent}
  .conv{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:14px;cursor:pointer}
  .conv:hover{background:rgba(255,255,255,.05)}
  .conv[aria-current="true"]{background:#2c4170}
  .av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;letter-spacing:-.02em}
  .ci{min-width:0;flex:1}
  .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ct b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .ct time{flex:none;font-size:12px;color:#8797ba}
  .cp{font-size:13.5px;color:#a2b0cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .conv.unread .cp{color:#fff;font-weight:600}
  .conv.unread .ct b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--signal);margin-left:8px;vertical-align:2px}
  .side .empty{padding:24px 16px;color:#8797ba;text-align:center}

  /* ---------- thread ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .head{flex:none;display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);min-height:72px}
  .back{display:none;border:0;background:none;padding:6px;margin-left:-8px;cursor:pointer}
  .back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .who{min-width:0;flex:1}
  .who .nm{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .who .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .ph{font-size:13.5px;color:var(--mute)}
  .edit{border:0;background:none;color:var(--signal);font-weight:700;font-size:13.5px;cursor:pointer;padding:4px 6px;border-radius:8px}
  .edit:hover{background:#eef2ff}
  .rename{display:flex;gap:8px;align-items:center}
  .rename input{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:16px;font-weight:700;width:min(260px,50vw)}
  .rename input:focus{outline:none;border-color:var(--signal)}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
  .btn.go{background:var(--signal);color:#fff}
  .btn.ghost{background:#eef1f5;color:var(--ink)}
  .to{flex:1;display:flex;align-items:center;gap:10px}
  .to label{font-weight:800;font-size:17px}
  .to input{flex:1;max-width:420px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
  .to input:focus{outline:none;border-color:var(--signal)}

  .thread{flex:1;overflow-y:auto;padding:22px clamp(14px,4vw,48px);display:flex;flex-direction:column;gap:4px}
  .day{align-self:center;font-size:12.5px;font-weight:600;color:var(--mute);margin:14px 0 8px}
  .b{max-width:min(68%,520px);padding:10px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;line-height:1.38;font-size:15.5px}
  .b.in{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
  .b.out{align-self:flex-end;background:var(--signal);color:var(--signal-ink);border-bottom-right-radius:6px}
  .b.out.fail{background:var(--warn-bg);color:var(--warn);border:1px solid #f1b7ab}
  .b a{color:inherit;text-underline-offset:2px}
  .stamp{font-size:12px;color:var(--mute);margin:2px 8px 10px}
  .stamp.in{align-self:flex-start}.stamp.out{align-self:flex-end}
  .stamp.fail{color:var(--warn);font-weight:600}
  .hello{margin:auto;text-align:center;max-width:340px;color:var(--mute)}
  .hello h2{color:var(--ink);font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}

  .bar{flex:none;background:var(--card);border-top:1px solid var(--line);padding:12px clamp(12px,3vw,28px) calc(12px + env(safe-area-inset-bottom))}
  .row{display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:20px;padding:11px 16px;font-size:16px;line-height:1.35;max-height:160px;min-height:46px;background:#fbfcfe}
  textarea:focus{outline:none;border-color:var(--signal);background:#fff}
  textarea:disabled{opacity:.5}
  .send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--signal);display:grid;place-items:center;cursor:pointer;transition:transform .12s}
  .send:active{transform:scale(.94)}
  .send:disabled{background:#c9d2e3;cursor:default}
  .send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .meta{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--mute);margin:7px 6px 0;min-height:1em}
  .meta .err{color:var(--warn);font-weight:600}

  .gate{margin:auto;max-width:380px;text-align:center;color:var(--mute);padding:24px}
  .gate h2{color:var(--ink);font-size:24px;font-weight:900;margin-bottom:6px}

  @media (max-width:820px){
    .side{width:100%}
    .main{display:none}
    body.open .side{display:none}
    body.open .main{display:flex}
    .back{display:block}
    .b{max-width:82%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">
    <div class="mark"><h1>Atlas <span>Text</span></h1></div>
    <div class="line"><i class="dot" id="dot"></i><span id="lineTxt">(201) 801-3971</span></div>
  </div>
  <div class="tools">
    <label class="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search people or messages" aria-label="Search"></label>
    <button class="compose-new" id="newBtn" aria-label="New text"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
  </div>
  <nav class="convs" id="convs"><div class="empty">Loading your texts…</div></nav>
</aside>

<main class="main">
  <div class="head" id="head"></div>
  <div class="thread" id="thread"></div>
  <div class="bar">
    <div class="row">
      <textarea id="msg" rows="1" placeholder="Text from Atlas"></textarea>
      <button class="send" id="send" disabled aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
    <div class="meta"><span id="status"></span><span id="count"></span></div>
  </div>
</main>
<datalist id="people"></datalist>

<script>
const SB = "https://dvschwyfeuarpaoyfoko.supabase.co";
const PUB = "sb_publishable_WPDhozNdc55NGL76azocCA_iho3vl_Z";
const KEY = new URLSearchParams(location.hash.slice(1)).get("k") || "";
const $ = (id) => document.getElementById(id);

let msgs = [], names = {}, current = null, mode = "list", editing = false, lastOk = 0;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmt = (p) => { const m = (p || "").match(/^\+1(\d{3})(\d{3})(\d{4})$/); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : p; };
const e164 = (s) => { const d = String(s).replace(/\D/g, ""); return d.length === 10 ? "+1" + d : d.length === 11 && d[0] === "1" ? "+" + d : null; };
const nameOf = (p) => names[p] || "";
const HUES = ["#3d6bff","#7a5af8","#0e9f6e","#e0703a","#d6457a","#1596b3","#8a6d1f","#5b6b8c"];
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; };
const initials = (p) => { const n = nameOf(p); return n ? n.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() : p.slice(-2); };
function when(iso, long){
  const d = new Date(iso), n = new Date(), t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === n.toDateString()) return t;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return long ? "Yesterday " + t : "Yesterday";
  if (n - d < 6 * 864e5) return d.toLocaleDateString([], { weekday: long ? "long" : "short" }) + (long ? " " + t : "");
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + (long ? " " + t : "");
}
function dayLabel(iso){
  const d = new Date(iso), n = new Date(), y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === n.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  if (n - d < 6 * 864e5) return d.toLocaleDateString([], { weekday: "long" });
  return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}
let seen = {}; try { seen = JSON.parse(localStorage.getItem("atlas_seen") || "{}"); } catch {}
const markSeen = (p, at) => { if (!at || seen[p] >= at) return; seen[p] = at; try { localStorage.setItem("atlas_seen", JSON.stringify(seen)); } catch {} };

function threads(){
  const by = new Map();
  for (const m of msgs) { if (!by.has(m.phone)) by.set(m.phone, []); by.get(m.phone).push(m); }
  return [...by.entries()].map(([phone, items]) => {
    const lastIn = [...items].reverse().find(m => m.dir === "in");
    return { phone, items, last: items[items.length - 1], unread: !!lastIn && (!seen[phone] || seen[phone] < lastIn.at) };
  }).sort((a, b) => String(b.last.at).localeCompare(String(a.last.at)));
}

function renderList(){
  const q = $("q").value.trim().toLowerCase(), qd = q.replace(/\D/g, "");
  const ts = threads().filter(t => !q || nameOf(t.phone).toLowerCase().includes(q) || (qd && t.phone.includes(qd)) ||
    t.items.some(m => m.body.toLowerCase().includes(q)));
  $("convs").innerHTML = ts.length ? ts.map(t => `
    <button class="conv ${t.unread ? "unread" : ""}" data-p="${esc(t.phone)}" aria-current="${t.phone === current}">
      <span class="av" style="background:${hue(t.phone)}">${esc(initials(t.phone))}</span>
      <span class="ci"><span class="ct"><b>${esc(nameOf(t.phone) || fmt(t.phone))}</b><time>${when(t.last.at)}</time></span>
      <span class="cp">${t.last.dir === "out" ? "You: " : ""}${esc(t.last.body)}</span></span>
    </button>`).join("")
    : `<div class="empty">${q ? "Nobody matches that search." : "No texts yet. Tap New to send your first one."}</div>`;
  document.querySelectorAll(".conv").forEach(b => b.onclick = () => openThread(b.dataset.p));
  $("people").innerHTML = Object.entries(names).map(([p, n]) => `<option value="${esc(fmt(p))}">${esc(n)}</option>`).join("");
}

function renderHead(){
  const back = `<button class="back" id="back" aria-label="Back to conversations"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`;
  if (mode === "new") {
    $("head").innerHTML = `${back}<div class="to"><label for="toIn">To</label><input id="toIn" list="people" inputmode="tel" autocomplete="off" placeholder="Phone number or pick a contact"></div>`;
    $("toIn").addEventListener("input", () => {
      const v = $("toIn").value, hit = Object.entries(names).find(([p, n]) => n.toLowerCase() === v.trim().toLowerCase());
      if (hit) $("toIn").value = fmt(hit[0]);
      updateSend();
    });
  } else if (current) {
    const n = nameOf(current);
    $("head").innerHTML = editing
      ? `${back}<form class="rename" id="renForm"><input id="renIn" value="${esc(n)}" placeholder="Name for ${esc(fmt(current))}" maxlength="80"><button class="btn go">Save</button><button type="button" class="btn ghost" id="renX">Cancel</button></form>`
      : `${back}<span class="av" style="background:${hue(current)}">${esc(initials(current))}</span>
         <div class="who"><div class="nm"><span>${esc(n || fmt(current))}</span><button class="edit" id="renBtn">${n ? "Rename" : "Add name"}</button></div>
         ${n ? `<div class="ph">${fmt(current)}</div>` : ""}</div>`;
    if (editing) {
      $("renIn").focus(); $("renIn").select();
      $("renX").onclick = () => { editing = false; renderHead(); };
      $("renForm").onsubmit = async (ev) => { ev.preventDefault(); await saveName(current, $("renIn").value); };
    } else $("renBtn").onclick = () => { editing = true; renderHead(); };
  } else $("head").innerHTML = "";
  const b = $("back"); if (b) b.onclick = () => { document.body.classList.remove("open"); mode = "list"; current = null; renderAll(); };
}

let sig = "";
function renderThread(force){
  const t = current ? threads().find(x => x.phone === current) : null;
  const items = t ? t.items : [];
  const s = mode + current + items.length + items.map(m => m.status || "").join();
  if (s === sig && !force) return; sig = s;
  const el = $("thread"), near = el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  if (mode === "list" || (!current && mode !== "new")) {
    el.innerHTML = `<div class="hello"><h2>Pick a conversation</h2>Or start a new text from the Atlas number.</div>`;
  } else if (!items.length) {
    el.innerHTML = `<div class="hello"><h2>${mode === "new" ? "New text" : "No messages yet"}</h2>${mode === "new" ? "Enter a number or pick a saved contact, then write your message." : "Say hello."}</div>`;
  } else {
    let h = "", day = "";
    items.forEach((m, i) => {
      const d = new Date(m.at).toDateString();
      if (d !== day) { day = d; h += `<div class="day">${dayLabel(m.at)}</div>`; }
      const fail = m.dir === "out" && (m.error || ["failed", "undelivered"].includes(m.status));
      h += `<div class="b ${m.dir} ${fail ? "fail" : ""}">${linkify(m.body)}</div>`;
      const nx = items[i + 1];
      if (!nx || nx.dir !== m.dir || new Date(nx.at) - new Date(m.at) > 300000) {
        const st = fail ? "Not delivered" : m.dir === "out" && m.status === "delivered" ? "Delivered" : "";
        h += `<div class="stamp ${m.dir} ${fail ? "fail" : ""}">${new Date(m.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}${st ? " · " + st : ""}</div>`;
      }
    });
    el.innerHTML = h;
  }
  if (force || near) el.scrollTop = el.scrollHeight;
  if (t) markSeen(current, t.last.at);
  $("msg").disabled = mode === "list" && !current;
}

function renderAll(force){ renderList(); renderHead(); renderThread(force); updateSend(); }
function openThread(p){ current = p; mode = "thread"; editing = false; document.body.classList.add("open"); $("status").textContent = ""; renderAll(true); $("msg").focus(); }
function newText(){ current = null; mode = "new"; editing = false; document.body.classList.add("open"); $("status").textContent = ""; renderAll(true); $("toIn").focus(); }

function target(){ return mode === "new" ? e164(($("toIn") || {}).value || "") : current; }
function updateSend(){
  const n = $("msg").value.length;
  $("count").textContent = n ? `${n}/1000` : "";
  $("send").disabled = !$("msg").value.trim() || !target();
}
function autosize(){ const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; updateSend(); }

async function send(){
  const to = target(), body = $("msg").value.trim();
  if (!to || !body) return;
  $("send").disabled = true; $("status").className = ""; $("status").textContent = "Sending…";
  try {
    const r = await fetch(`${SB}/functions/v1/atlas`, { method: "POST",
      headers: { "Content-Type": "application/json", "x-atlas-key": KEY }, body: JSON.stringify({ to, body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    $("msg").value = ""; autosize();
    $("status").textContent = "Sent";
    current = j.to || to; mode = "thread";
    await load(true);
  } catch (e) {
    $("status").innerHTML = `<span class="err">Not sent. ${esc(e.message)}</span>`;
  } finally { updateSend(); }
}

async function saveName(p, n){
  try {
    const r = await fetch(`${SB}/rest/v1/rpc/atlas_save_contact`, { method: "POST",
      headers: { "Content-Type": "application/json", apikey: PUB }, body: JSON.stringify({ k: KEY, p, n }) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    if (n.trim()) names[p] = n.trim(); else delete names[p];
    editing = false; renderAll(); await load();
  } catch (e) { $("status").innerHTML = `<span class="err">Couldn't save the name. ${esc(e.message)}</span>`; }
}

async function load(force){
  try {
    const r = await fetch(`${SB}/rest/v1/rpc/atlas_inbox`, { method: "POST",
      headers: { "Content-Type": "application/json", apikey: PUB }, body: JSON.stringify({ k: KEY }) });
    if (r.status === 401 || r.status === 403) return gate();
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    msgs = d.messages || []; names = d.contacts || {}; lastOk = Date.now();
    $("dot").classList.remove("off"); $("lineTxt").textContent = "(201) 801-3971";
    renderList(); if (!editing) renderHead(); renderThread(force); updateSend();
  } catch (e) {
    if (Date.now() - lastOk > 30000) { $("dot").classList.add("off"); $("lineTxt").textContent = "Reconnecting…"; }
  }
}
function gate(){
  document.body.innerHTML = `<div class="gate"><h2>Atlas Text</h2>This link is missing its key. Open the full link James saved.</div>`;
}

$("q").addEventListener("input", renderList);
$("msg").addEventListener("input", autosize);
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(hover:hover)").matches) { e.preventDefault(); send(); }
});
$("send").onclick = send;
$("newBtn").onclick = newText;

if (!KEY) gate();
else {
  renderAll();
  load(true);
  setInterval(() => { if (!document.hidden) load(); }, 7000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
</script>
</body>
</html>
